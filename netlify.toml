[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "vite"

# Send every page route to the React app so reloading /dashboard or /report works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response.
# The script-src hash allows only the inline script Netlify's "Powered by Netlify" badge injects (required on the
# free plan). If the badge disappears after a Netlify update, the console shows the new hash to put here.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-src https://app.netlify.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
